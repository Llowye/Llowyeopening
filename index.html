<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Llowye</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#fff;
  overflow:hidden;
}

/*======================
MAIN CARD
=======================*/

#mainContent{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  opacity:1;
  transform:scale(1);
  background:#fff;
  overflow-y:auto;
  padding:0px 0 60px;
}

.cardWrapper{
  width:360px;
  max-width:92%;
  text-align:center;
}

.bebek{
  width:180px;
  margin-top:-55px;
  margin-bottom:-40px;
}

.netflixBox{
  background:#FCFBD2;
  border:6px solid #D4F6FC;
  border-radius:70px;
  padding:-50px;
  margin:-15px auto 14px;
  width:65%;
}

.netflixTitle .logo{
  height:150px;
  margin-top:-20px;
   margin-bottom:-30px;
}

.topBar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#FCFBD2;
  border:10px solid #C8F7F2;
  border-radius:40px 40px 0 0;
  padding:8px 16px;
  margin:0 auto 14px;
  height:50px;
  width:80%;
}

.loveGif{
  height:130px;
   margin-top:-20px;
   margin-bottom:-30px;
}
.iconsImg{
  height:22px;
  width:auto;
}

.closeBtn{
  cursor:pointer;
  font-weight:bold;
}

.profileCard{
  padding:14px;
  background:#FCFBD2;
  border:10px solid #C8F7F2;
  border-radius:0 0 35px 35px;
  text-align:center;
  width:80%;
  margin:0 auto;
}

h1{
  font-family:'Baloo 2',sans-serif;
  color:#e0195a;
  font-size:26px;
  letter-spacing:1px;
}

h2{
  font-family:'Baloo 2',sans-serif;
  color:#1a1a6e;
  font-size:20px;
  font-weight:700;
  margin:6px 0 4px;
}

.divider{
  height:5px;
  background:#fff;
  width:90%;
  margin:12px auto;
  border-radius:3px;
}

.dividerBottom{
  margin-top:20px;
}

.idCard{
  border:2px solid #d9c2d2;
  border-radius:10px;
  overflow:hidden;
  margin:0 auto 4px;
  width:65%;
}

.idCard img{
  width:100%;
  display:block;
}

.arrowDown{
  color:#ff3b3b;
  font-size:50px;
   margin-top:-10px;
  margin-bottom:1px;
}
.openBtn{
  display:inline-block;
  background:#A3EFFF;
  color:#1a1a6e;
  font-weight:900;
  text-decoration:none;
  padding:14px 55px;
  border-radius:40px;
  border:6px solid #fff;
  box-shadow:0 8px 0 #6bc4ea, 0 10px 15px rgba(0,0,0,.2);
  transition:.15s;
  margin-top:1px;
  margin-bottom:20px;
}

.openBtn:active{
  transform:translateY(2px);
  box-shadow:0 2px 0 #2aa9d1;
}

/*======================
LEAF LOADER
=======================*/

#leafLoader{
  position:fixed;
  inset:0;
  background:#fff;
  z-index:99999;
  overflow:hidden;
}
#leafKiri, #leafKanan{
  position:absolute;
  top:0;
  height:100%;
  width:auto;
  min-width:60%;
  object-fit:cover;
}
#leafKiri{
  left:0;
}
#leafKanan{
  right:0;
}
#leafKiri.open{
  animation: arcLeft 1.4s ease-in-out forwards;
}
#leafKanan.open{
  animation: arcRight 1.4s ease-in-out forwards;
}
@keyframes arcLeft{
  0%{
    transform: translate(0,0) rotate(0deg);
  }
  50%{
    transform: translate(-40%,80px) rotate(-12deg);
  }
  100%{
    transform: translate(-115%,-20px) rotate(-25deg);
  }
}

@keyframes arcRight{
  0%{
    transform: translate(0,0) rotate(0deg);
  }
  50%{
    transform: translate(40%,80px) rotate(12deg);
  }
  100%{
    transform: translate(115%,-20px) rotate(25deg);
  }
}
@media(max-width:500px){
  .profileCard{ padding:10px; }
}
</style>
</head>

<body>

<!-- Opening (daun) -->
<div id="leafLoader">
  <img src="237233-remove-bg-io.png" id="leafKiri">
  <img src="237232-remove-bg-io.png" id="leafKanan">
</div>

<!-- MAIN -->
<div id="mainContent">

  <div class="cardWrapper">

    <img src="bebek.gif" class="bebek">

    <div class="netflixBox">
      <div class="netflixTitle">
        <img src="netflix.gif" class="logo">
      </div>
    </div>

    <div class="topBar">
      <div class="love"><img src="love.gif" class="loveGif"></div>
      <a href="https://llowye.github.io/Llowyerecord/" target="_blank">
  <img src="icons.png" class="iconsImg">
</a>
    </div>

    <div class="profileCard">

      <h1>!! HOLA !!</h1>
      <h2>WELCOME TO MY STORE</h2>

      <div class="divider"></div>

      <div class="idCard">
  <a href="https://you-deserve-this-maker.vercel.app/?c=W1si8J%2BMmSIsIkxhdGUgTmlnaHQgQ3VkZGxlcyIsIkJlaW5nIGFuIGFkdWx0IGlzIGxvbmVseS4gU3VrdXJpbiBkZWggbG8uLi4iXSxbIvCfjLEiLCJIZXkgdSEgS2VlcCBzcGlyaXQuIiwiQ3V6IFdlIGh2IHRvbW9ycm93IDRyIGEgcmVhc29uIF5eIl0sWyLwn42cIiwiQXlhbSBNaWUiLCJEaWFtIGJ1a2FuIGJlcmFydGkgbGVtYWgsIHRhcGkgbGFwZXIuIl0sWyLwn6e4IiwiQmlnIGh1ZyIsIlBlb3BsZSBrYWRhbmcgY29tZSBhbmQgcHJldC4uLiJdLFsi8J%2BMvCIsIkJlZ2dlZCIsIkN1a3VwIGFudGFydGlrYSBhamEgeWcgamF1aCwgYW50YXJraXRhIGphbmdhbi4uLiJdXQ%3D%3D" target="_blank">
    <img src="ktp.gif" alt="license card">
  </a>
      </div>

      <div class="divider dividerBottom"></div>

      <div class="arrowDown">﹀</div>

      <a href="https://llowyeshop.carrd.co/" class="openBtn">OPEN</a>

    </div>

  </div>

</div>

<script>
const loader = document.getElementById("leafLoader");
const main = document.getElementById("mainContent");
const leafKiri = document.getElementById("leafKiri");
const leafKanan = document.getElementById("leafKanan");

document.body.style.overflow = "hidden";

// Buka daun kiri & kanan
setTimeout(()=>{
  leafKiri.classList.add("open");
  leafKanan.classList.add("open");
}, 500);

// Hapus loader
setTimeout(()=>{
  loader.style.opacity = "0";
  loader.style.transition = "0.6s ease";
  setTimeout(()=>{
    loader.remove();
    document.body.style.overflow = "auto";
  }, 600);
}, 1900);

  function playClickSound(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "square";
  osc.frequency.value = 800;
  gain.gain.setValueAtTime(0.15, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.08);
}

const openBtn = document.querySelector(".openBtn");
if(openBtn){
  openBtn.addEventListener("click", playClickSound);
}
const closeBtn = document.querySelector(".closeBtn");
if(closeBtn){
  closeBtn.addEventListener("click", ()=>{
    main.style.display = "none";
  });
}
</script>

</body>
</html>
