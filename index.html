<style>
  #confettiContainer{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9998;
  overflow:hidden;
}
 .confetti-piece{
  position:absolute;
   width:8px;
   height:14px;
  opacity:1;
  will-change: transform;
  animation: confettiBurst forwards;
}

.confetti-square{
  width:5px;
  height:14px;
}

.confetti-circle{
  width:8px;
  height:8px;
  border-radius:50%;
}

.confetti-star{
  width:12px;
  height:12px;
  clip-path: polygon(
    50% 0%, 61% 35%, 98% 35%, 68% 57%,
    79% 91%, 50% 70%, 21% 91%, 32% 57%,
    2% 35%, 39% 35%
  );
  animation: confettiBurst 1.8s cubic-bezier(0.25,0.8,0.25,1) forwards,
              twinkle 0.4s ease-in-out infinite;
}

@keyframes twinkle{
  0%, 100%{ opacity:1; filter:brightness(1); }
  50%{ opacity:0.5; filter:brightness(1.8) drop-shadow(0 0 4px currentColor); }
}

  @keyframes confettiBurst{
  0%{
    transform: translate(0, 0) rotate(0deg);
  }
  /* Melesat CEPAT & TINGGI melewati layar atas */
  25%{
    transform: translate(var(--dx), var(--dy)) rotate(calc(var(--rot) * 0.4));
    animation-timing-function: cubic-bezier(0.05, 0.9, 0.1, 1);
  }
  /* Melayang turun & menyebar dari posisi puncak */
  100%{
    transform: translate(calc(var(--dx) + var(--wobble)), 120vh) rotate(var(--rot));
    animation-timing-function: ease-in;
  }
  }

.modalOverlay {

  align-items: flex-start;

.modalOverlay.show {
  opacity: 1;
  pointer-events: auto;
}

/* PAPAN PUTIH MODAL */

.modalOverlay.show .modalBox {

/*======================

=======================*/

#leafLoader{
  position:fixed;
  inset:0;
  z-index:99999;
  overflow:hidden;
}
#leafKiri, #leafKanan{
  position:absolute;
  top:0;
  height:100%;
  width:52%;
  will-change: transform;
  background:
    repeating-linear-gradient(
      90deg,
      #7a0000 0px,
      #a80000 15px,
      #d61f1f 30px,
      #a80000 45px,
      #7a0000 60px
    );
  box-shadow: inset -20px 0 40px rgba(0,0,0,.5), inset 20px 0 40px rgba(0,0,0,.3);
  filter: blur(0.3px);
}
#leafKiri{
  left:0;
}
#leafKanan{
  right:0;
}
#leafKiri.open{
  animation: curtainLeft 2.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
}
#leafKanan.open{
  animation: curtainRight 2.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
}
@keyframes curtainLeft{
  0%{ transform: translateX(0); }
  100%{ transform: translateX(-100%); }
}
@keyframes curtainRight{
  0%{ transform: translateX(0); }
  100%{ transform: translateX(100%); }
}

<script>
const loader = document.getElementById("leafLoader");
const main = document.getElementById("mainContent");
const leafKiri = document.getElementById("leafKiri");
const leafKanan = document.getElementById("leafKanan");

document.body.style.overflow = "hidden";

function fireConfetti(){
  const container = document.getElementById("confettiContainer");
  const colors = ["#ff595e","#ffca3a","#8ac926","#1982c4","#6a4c93","#ff6fb5"];
  const shapes = ["confetti-square", "confetti-circle", "confetti-star"];
  const fragment = document.createDocumentFragment();

  for(let i = 0; i < 140; i++){
    const piece = document.createElement("div");
    const shape = shapes[Math.floor(Math.random() * shapes.length)];
    piece.className = "confetti-piece " + shape;

    const fromLeft = i % 2 === 0;
    
    piece.style.left = fromLeft ? "0px" : "auto";
    piece.style.right = fromLeft ? "auto" : "0px";
    piece.style.top = (35 + Math.random() * 30) + "vh";

    piece.style.background = (shape === "confetti-star")
      ? "#FFD700"
      : colors[Math.floor(Math.random() * colors.length)];

    const targetX = (5 + Math.random() * 90) + "vw";
    const dx = fromLeft ? targetX : "-" + targetX;
    const dy = "-" + (100 + Math.random() * 30) + "vh"; 
    const wobble = (Math.random() * 12 - 6) + "vw";

    piece.style.setProperty("--dx", dx);
    piece.style.setProperty("--dy", dy);
    piece.style.setProperty("--wobble", wobble);
    piece.style.setProperty("--rot", (Math.random() * 1080 - 540) + "deg");

    piece.style.animationDuration = (2.5 + Math.random() * 1.5) + "s";
    piece.style.animationDelay = (Math.random() * 0.15) + "s";

    piece.addEventListener("animationend", () => piece.remove());
    fragment.appendChild(piece);
  }
  container.appendChild(fragment);
}
  
// Fungsi untuk buka & tutup Modal
function showSnkModal() {
  document.getElementById("snkModal").classList.add("show");
}

function closeSnk() {
  document.getElementById("snkModal").classList.remove("show");
}

function acceptSnk() {
  closeSnk();
  playClickSound();
}

// Buka Pop-up otomatis setelah 3 detik
setTimeout(() => {
  showSnkModal();
}, 3000);
  
// Buka daun kiri & kanan
setTimeout(()=>{
  leafKiri.classList.add("open");
  leafKanan.classList.add("open");
}, 500);

setTimeout(()=>{
  fireConfetti();
}, 1800);

// Hapus loader
setTimeout(()=>{
  loader.style.opacity = "0";
  loader.style.transition = "0.6s ease";
  setTimeout(()=>{
    loader.remove();
    document.body.style.overflow = "auto";
  }, 600);
}, 5000);

function playClickSound(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "square";
  osc.frequency.value = 800;
  gain.gain.setValueAtTime(0.4, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.08);
}

const openBtn = document.querySelector(".openBtn");
if(openBtn){
  openBtn.addEventListener("click", ()=>{
    playClickSound();
    openBtn.style.animation = "none";
  });
}
const closeBtn = document.querySelector(".closeBtn");
if(closeBtn){
  closeBtn.addEventListener("click", ()=>{
    main.style.display = "none";
  });
}
</script>
