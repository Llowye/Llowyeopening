<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Llowye</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#fff;
  overflow:hidden;
}

/*======================
MAIN CARD
=======================*/

#mainContent{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  opacity:1;
  transform:scale(1);
  background:#fff;
  overflow-y:auto;
  padding:0px 0;
}

.cardWrapper{
  width:360px;
  max-width:92%;
  text-align:center;
}

.bebek{
  width:180px;
  margin-top:-15px;
  margin-bottom:2px;
}

.netflixBox{
  margin-top:-15px;
  margin-bottom:14px;
}

.netflixTitle .logo{
  height:200px;
}

.topBar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#fdf8e4;
  border:2px solid #bfe6f5;
  border-radius:20px;
  padding:8px 16px;
  margin-bottom:14px;
}

.loveGif{
  height:55px;
}

.closeBtn{
  cursor:pointer;
  font-weight:bold;
}

.profileCard{
  padding:14px;
  background:#fdf8e4;
  border:4px solid #bfe6f5;
  border-radius:35px;
  text-align:center;
}

h1{
  font-family:'Baloo 2',sans-serif;
  color:#e0195a;
  font-size:26px;
  letter-spacing:1px;
}

h2{
  font-family:'Baloo 2',sans-serif;
  color:#1a1a6e;
  font-size:17px;
  font-weight:700;
  margin:6px 0 4px;
}

.divider{
  height:2px;
  background:#fff;
  width:90%;
  margin:12px auto;
  border-radius:2px;
}

.idCard{
  border:2px solid #d9c2d2;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:4px;
}

.idCard img{
  width:100%;
  display:block;
}

.arrowDown{
  color:#ff3b3b;
  font-size:20px;
  margin-bottom:10px;
}

.openBtn{
  display:inline-block;
  background:#3cc6f0;
  color:#0b2e4f;
  font-weight:700;
  text-decoration:none;
  padding:12px 50px;
  border-radius:40px;
  border:2px solid #fff;
  box-shadow:0 4px 0 #2aa9d1;
  transition:.2s;
}

.openBtn:active{
  transform:translateY(2px);
  box-shadow:0 2px 0 #2aa9d1;
}

/*======================
LEAF LOADER
=======================*/

#leafLoader{
  position:fixed;
  inset:0;
  background:#fff;
  z-index:99999;
  overflow:hidden;
}

#leafKiri, #leafKanan{
  position:absolute;
  top:0;
  height:100%;
  width:auto;
  min-width:60%;
  object-fit:cover;
  transition: transform 1.2s ease-in-out;
}

#leafKiri{
  left:0;
  transform:translateX(0);
}

#leafKanan{
  right:0;
  transform:translateX(0);
}

#leafKiri.open{
  transform:translateX(-110%);
}

#leafKanan.open{
  transform:translateX(110%);
}

@media(max-width:500px){
  .profileCard{ padding:10px; }
}
</style>
</head>

<body>

<!-- Opening (daun) -->
<div id="leafLoader">
  <img src="kiri.png" id="leafKiri">
  <img src="kanan.png" id="leafKanan">
</div>

<!-- MAIN -->
<div id="mainContent">

  <div class="cardWrapper">

    <img src="bebek.gif" class="bebek">

    <div class="netflixBox">
      <div class="netflixTitle">
        <img src="netflix.gif" class="logo">
      </div>
    </div>

    <div class="topBar">
      <div class="love"><img src="love.gif" class="loveGif"></div>
      <div class="icons">
        <span>📶</span>
        <span>🎵</span>
        <span class="closeBtn">✕</span>
      </div>
    </div>

    <div class="profileCard">

      <h1>!! HALLO !!</h1>
      <h2>WELCOME TO MY STORE</h2>

      <div class="divider"></div>

      <div class="idCard">
        <img src="ktp.gif" alt="license card">
      </div>

      <div class="divider dividerBottom"></div>
      .dividerBottom{
        margin-top:20px;
      {

      <div class="arrowDown">﹀</div>

      <a href="https://llowyeshop.carrd.co/" class="openBtn">OPEN</a>

    </div>

  </div>

</div>

<script>
const loader = document.getElementById("leafLoader");
const main = document.getElementById("mainContent");
const leafKiri = document.getElementById("leafKiri");
const leafKanan = document.getElementById("leafKanan");

document.body.style.overflow = "hidden";

// Buka daun kiri & kanan
setTimeout(()=>{
  leafKiri.classList.add("open");
  leafKanan.classList.add("open");
}, 500);
  
// Hapus loader
setTimeout(()=>{
  loader.style.opacity = "0";
  loader.style.transition = "0.6s ease";
  setTimeout(()=>{
    loader.remove();
    document.body.style.overflow = "auto";
  }, 600);
}, 1900);

const closeBtn = document.querySelector(".closeBtn");
if(closeBtn){
  closeBtn.addEventListener("click", ()=>{
    main.style.display = "none";
  });
}
</script>

</body>
</html>
