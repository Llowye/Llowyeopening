.confetti-star{

@keyframes twinkle{

  @keyframes confettiBurst{
  0%{

  25%{
    transform: translate(var(--dx), var(--dy)) rotate(calc(var(--rot) * 0.4));

  }
  100%{
    transform: translate(calc(var(--dx) + var(--wobble)), 120vh) rotate(var(--rot));

  }

<script>
const loader = document.getElementById("leafLoader");
const main = document.getElementById("mainContent");
const leafKiri = document.getElementById("leafKiri");
const leafKanan = document.getElementById("leafKanan");

document.body.style.overflow = "hidden";

function fireConfetti(){
  const container = document.getElementById("confettiContainer");
  const colors = ["#ff595e","#ffca3a","#8ac926","#1982c4","#6a4c93","#ff6fb5"];
  const shapes = ["confetti-square", "confetti-circle", "confetti-star"];
  const fragment = document.createDocumentFragment();

  for(let i = 0; i < 140; i++){
    const piece = document.createElement("div");
    const shape = shapes[Math.floor(Math.random() * shapes.length)];
    piece.className = "confetti-piece " + shape;

    const fromLeft = i % 2 === 0;
    
    piece.style.left = fromLeft ? "0px" : "auto";
    piece.style.right = fromLeft ? "auto" : "0px";
    piece.style.top = (35 + Math.random() * 30) + "vh";

    piece.style.background = (shape === "confetti-star")
      ? "#FFD700"
      : colors[Math.floor(Math.random() * colors.length)];

    const targetX = (5 + Math.random() * 90) + "vw";
    const dx = fromLeft ? targetX : "-" + targetX;
    const dy = "-" + (100 + Math.random() * 30) + "vh"; 
    const wobble = (Math.random() * 12 - 6) + "vw";

    piece.style.setProperty("--dx", dx);
    piece.style.setProperty("--dy", dy);
    piece.style.setProperty("--wobble", wobble);
    piece.style.setProperty("--rot", (Math.random() * 1080 - 540) + "deg");

    piece.style.animationDuration = (2.5 + Math.random() * 1.5) + "s";
    piece.style.animationDelay = (Math.random() * 0.15) + "s";

    piece.addEventListener("animationend", () => piece.remove());
    fragment.appendChild(piece);
  }
  container.appendChild(fragment);
}

function showSnkModal() {
  document.getElementById("snkModal").classList.add("show");
}

function closeSnk() {
  const modal = document.getElementById("snkModal");
  modal.classList.add("hideRight");
  
  setTimeout(() => {
    modal.classList.remove("show");
    modal.classList.remove("hideRight");
  }, 500);
}

function acceptSnk() {
  closeSnk();
  playClickSound();
}

setTimeout(() => {
  showSnkModal();
}, 3000);

setTimeout(()=>{
  leafKiri.classList.add("open");
  leafKanan.classList.add("open");
}, 500);

setTimeout(()=>{
  fireConfetti();
}, 1800);

setTimeout(()=>{
  loader.style.opacity = "0";
  loader.style.transition = "0.6s ease";
  setTimeout(()=>{
    loader.remove();
    document.body.style.overflow = "auto";
  }, 600);
}, 5000);

function playClickSound(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "square";
  osc.frequency.value = 800;
  gain.gain.setValueAtTime(0.4, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.08);
}

const openBtn = document.querySelector(".openBtn");
if(openBtn){
  openBtn.addEventListener("click", ()=>{
    playClickSound();
    openBtn.style.animation = "none";
  });
}
const closeBtn = document.querySelector(".closeBtn");
if(closeBtn){
  closeBtn.addEventListener("click", ()=>{
    main.style.display = "none";
  });
}
</script>
