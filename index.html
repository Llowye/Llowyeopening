<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Llowye</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#fff;
  overflow:hidden;
}

/*======================
MAIN CARD
=======================*/

#mainContent{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  opacity:0;
  transform:scale(1.05);
  transition:1s;
  background:#fff;
  overflow-y:auto;
  padding:30px 0;
}

#mainContent.show{
  opacity:1;
  transform:scale(1);
}

.profileCard{
  width:360px;
  max-width:92%;
  padding:14px;
  background:#fdf8e4;
  border:4px solid #bfe6f5;
  border-radius:35px;
  text-align:center;
}

.bebek{
  width:180px;
  margin-bottom:10px;
}

.netflixTitle{
  background:#000;
  border-radius:40px;
  padding:14px 10px;
  margin-bottom:12px;
}

.netflixTitle .logo{
  height:34px;
}

.topBar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#fdf8e4;
  border:2px solid #bfe6f5;
  border-radius:20px;
  padding:8px 16px;
  margin-bottom:14px;
}

.heartsGif{
  height:22px;
}

.closeBtn{
  cursor:pointer;
  font-weight:bold;
}

h1{
  color:#e0195a;
  font-size:22px;
  letter-spacing:1px;
}

h2{
  color:#1a1a6e;
  font-size:15px;
  margin:6px 0 4px;
}

.divider{
  height:2px;
  background:#fff;
  width:90%;
  margin:12px auto;
  border-radius:2px;
}

.idCard{
  border:2px solid #d9c2d2;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:4px;
}

.idCard img{
  width:100%;
  display:block;
}

.arrowDown{
  color:#ff3b3b;
  font-size:20px;
  margin-bottom:10px;
}

.openBtn{
  display:inline-block;
  background:#3cc6f0;
  color:#0b2e4f;
  font-weight:700;
  text-decoration:none;
  padding:12px 50px;
  border-radius:40px;
  border:2px solid #fff;
  box-shadow:0 4px 0 #2aa9d1;
  transition:.2s;
}

.openBtn:active{
  transform:translateY(2px);
  box-shadow:0 2px 0 #2aa9d1;
}

/*======================
LEAF LOADER
=======================*/

#leafLoader{
  position:fixed;
  inset:0;
  background:#fff;
  z-index:99999;
  overflow:hidden;
}

#leafKiri, #leafKanan{
  position:absolute;
  top:0;
  height:100%;
  width:auto;
  min-width:60%;
  object-fit:cover;
  transition: transform 1.2s ease-in-out;
}

#leafKiri{
  left:0;
  transform:translateX(0);
}

#leafKanan{
  right:0;
  transform:translateX(0);
}

#leafKiri.open{
  transform:translateX(-110%);
}

#leafKanan.open{
  transform:translateX(110%);
}

@media(max-width:500px){
  .profileCard{ padding:10px; }
}
</style>
</head>

<body>

<!-- Opening (daun) -->
<div id="leafLoader">
  <img src="kiri.png" id="leafKiri">
  <img src="kanan.png" id="leafKanan">
</div>

<!-- MAIN -->
<div id="mainContent">

  <div class="profileCard">

    <img src="bebek.gif" class="bebek">

    <div class="netflixTitle">
      <img src="netflix.gif" class="logo">
    </div>

    <div class="topBar">
      <div class="hearts"><img src="love.gif" class="heartsGif"></div>
      <div class="icons">
        <span>📶</span>
        <span>🎵</span>
        <span class="closeBtn">✕</span>
      </div>
    </div>

    <h1>!! HALLO !!</h1>
    <h2>WELCOME TO MY STORE</h2>

    <div class="divider"></div>

    <div class="idCard">
      <img src="ktp.gif" alt="license card">
    </div>

    <div class="divider"></div>

    <div class="arrowDown">﹀</div>

    <a href="https://llowyeshop.carrd.co/" class="openBtn">OPEN</a>

  </div>

</div>

<script>
const loader = document.getElementById("leafLoader");
const main = document.getElementById("mainContent");
const leafKiri = document.getElementById("leafKiri");
const leafKanan = document.getElementById("leafKanan");

document.body.style.overflow = "hidden";

// Buka daun kiri & kanan
setTimeout(()=>{
  leafKiri.classList.add("open");
  leafKanan.classList.add("open");
}, 500);

// Munculkan konten
setTimeout(()=>{
  main.classList.add("show");
}, 1400);

// Hapus loader
setTimeout(()=>{
  loader.style.opacity = "0";
  loader.style.transition = "0.6s ease";
  setTimeout(()=>{
    loader.remove();
    document.body.style.overflow = "auto";
  }, 600);
}, 1900);

const closeBtn = document.querySelector(".closeBtn");
if(closeBtn){
  closeBtn.addEventListener("click", ()=>{
    main.style.display = "none";
  });
}
</script>

</body>
</html>
